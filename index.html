<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="description" content="MJINII LIFE — a Kenyan urban life simulation. Work, eat, hustle, survive.">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>MJINII LIFE</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;600;900&family=Playfair+Display:ital,wght@1,700&display=swap');
:root{
  --bg:#0a0a0a; --fg:#f2f2f2; --accent:#ccff00; --teal:#0d9488;
  --card:#141414; --line:#222; --muted:#9a9a9a; --red:#e63946;
  --pad:1rem;
}
*{margin:0;padding:0;box-sizing:border-box;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:"Inter",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--fg);padding:var(--pad);min-height:100vh;line-height:1.4}
header{text-align:center;margin-bottom:1.25rem}
header h1{font-family:"Playfair Display",Georgia,serif;font-style:italic;font-weight:700;font-size:clamp(2.2rem,11vw,4.5rem);letter-spacing:-0.03em;color:var(--accent);line-height:1}
header p{color:var(--muted);font-size:clamp(.75rem,3vw,.95rem);margin-top:.35rem}
.wrap{max-width:1000px;margin:0 auto}
.screen{display:none}
.screen.active{display:block}
h2.section{color:var(--accent);font-size:1rem;text-transform:uppercase;letter-spacing:.08em;margin-bottom:.8rem;text-align:center}
.grid{display:grid;grid-template-columns:1fr;gap:.7rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:1rem 1.1rem;cursor:pointer;transition:border-color .15s,transform .1s}
.card:active{transform:scale(.99)}
.card:hover,.card:focus-visible{border-color:var(--accent);outline:none}
.card h3{font-weight:900;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-size:.85rem;margin-bottom:.3rem}
.card p{font-size:.85rem;color:var(--muted)}
.card small{display:block;margin-top:.4rem;font-size:.7rem;color:var(--teal);font-weight:700}
.topbar{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem;flex-wrap:wrap;margin-bottom:.7rem}
.topbar h2{color:var(--accent);font-size:1rem;text-transform:uppercase;letter-spacing:.07em}
.topbar .day{color:var(--muted);font-size:.8rem}
.stats{display:flex;gap:.9rem;flex-wrap:wrap;align-items:baseline;margin-bottom:.5rem}
.stat{font-weight:900;font-size:1.15rem;color:var(--accent)}
.stat.teal{color:var(--teal)}
.stat.fg{color:var(--fg)}
.stat small{display:block;font-size:.6rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.meters{display:grid;grid-template-columns:repeat(5,1fr);gap:.3rem;margin:.5rem 0 1rem}
.meter{height:24px;background:#1a1a1a;border-radius:99px;overflow:hidden;position:relative}
.meter-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--teal),var(--accent));width:0%;transition:width .25s ease}
.meter-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.55rem;font-weight:800;color:#0a0a0a;letter-spacing:.04em}
.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:.5rem}
.btn{display:inline-flex;align-items:center;justify-content:center;background:var(--accent);color:#0a0a0a;border:none;border-radius:10px;padding:.85rem .6rem;min-height:48px;font-family:inherit;font-weight:900;font-size:.8rem;letter-spacing:.02em;cursor:pointer;text-align:center}
.btn:active{opacity:.85}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.secondary{background:#1c1c1c;color:var(--fg);border:1px solid #333}
.btn.wide{grid-column:1/-1}
.meta{display:flex;gap:1rem;flex-wrap:wrap;font-size:.75rem;color:var(--muted);margin-top:.9rem}
.meta b{color:var(--fg)}
.meta b.red{color:var(--red)}
.panel{margin-top:1rem}
.panel h3{font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin-bottom:.4rem}
.npc-card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.5rem .7rem;font-size:.78rem;margin-bottom:.35rem}
.npc-card b{color:var(--accent)}
.log{max-height:170px;overflow-y:auto;background:#0f0f0f;border:1px solid var(--line);border-radius:10px;padding:.6rem .7rem;font-size:.78rem;color:#ccc;-webkit-overflow-scrolling:touch}
.log div{padding:.22rem 0;border-bottom:1px solid #171717;line-height:1.35}
.log div:first-child{color:var(--fg)}
.log b{color:var(--accent)}
.log .ev{color:var(--teal)}
.row{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.9rem}
@media(min-width:600px){
  .grid{grid-template-columns:repeat(2,1fr)}
  .actions{grid-template-columns:repeat(3,1fr)}
}
@media(min-width:768px){
  :root{--pad:2rem}
  .grid{grid-template-columns:repeat(3,1fr)}
  .actions{grid-template-columns:repeat(4,1fr)}
}
</style>
</head>
<body>
<header>
  <h1>MJINII LIFE</h1>
  <p>Kenyan urban sim — work, eat, hustle, survive. Rent hits Saturday.</p>
</header>

<div class="wrap">
  <section id="select" class="screen active">
    <h2 class="section">Choose Your Path</h2>
    <div class="grid" id="archetypeGrid"></div>
    <div class="row" id="continueRow" style="justify-content:center"></div>
  </section>

  <section id="game" class="screen">
    <div class="topbar">
      <h2 id="playerTitle">—</h2>
      <div class="day" id="dayDisplay">Day 1</div>
    </div>

    <div class="stats">
      <div><span class="stat" id="money">KES 0</span><small>Money</small></div>
      <div><span class="stat teal" id="energy">60%</span><small>Energy</small></div>
      <div><span class="stat fg" id="happiness">70%</span><small>Happy</small></div>
    </div>

    <div class="meters">
      <div class="meter"><div class="meter-fill" id="mHunger"></div><div class="meter-label">HUNGER</div></div>
      <div class="meter"><div class="meter-fill" id="mEnergy"></div><div class="meter-label">ENERGY</div></div>
      <div class="meter"><div class="meter-fill" id="mFun"></div><div class="meter-label">FUN</div></div>
      <div class="meter"><div class="meter-fill" id="mHygiene"></div><div class="meter-label">HYG</div></div>
      <div class="meter"><div class="meter-fill" id="mSocial"></div><div class="meter-label">SOCIAL</div></div>
    </div>

    <div class="actions" id="actions"></div>

    <div class="meta">
      <span>Rent: <b class="red" id="rentDue">Day 6</b></span>
      <span>Room: <b id="room">—</b></span>
      <span>Career: <b id="career">—</b></span>
    </div>

    <div class="panel">
      <h3>Your Circle</h3>
      <div id="npcs"></div>
    </div>

    <div class="panel">
      <h3>Event Log</h3>
      <div class="log" id="log"></div>
    </div>

    <div class="row">
      <button class="btn secondary" id="resetBtn">Reset Game</button>
      <button class="btn secondary" id="newBtn">New Game</button>
    </div>
  </section>
</div>

<script type="module">
import { state, save, load, hasSave, reset, archetypes } from './src/state.js';
import { actionMap } from './src/actions.js';
import { advanceDay, recomputeHappiness } from './src/turn.js';
import { renderStats, renderActions, renderNPCs, renderArchetypes, log } from './src/ui.js';

const $ = id => document.getElementById(id);

function showGame() {
  $('select').classList.remove('active');
  $('game').classList.add('active');
  $('playerTitle').textContent = (archetypes[state.type]?.name || state.type).toUpperCase();
  renderStats();
  renderActions();
  renderNPCs();
  $('log').innerHTML = '';
  if (state.eventLog.length) {
    state.eventLog.slice(-20).forEach(entry => log(entry));
  } else {
    log(`<b>Karibu.</b> You are a ${state.career}. Rent due Saturday — hustle wisely.`);
  }
}

function persist(line) {
  if (!line) return;
  state.eventLog.push(line);
  if (state.eventLog.length > 50) state.eventLog = state.eventLog.slice(-50);
}

window.handleAction = function (id) {
  const fn = actionMap[id];
  if (!fn) return;
  const line = fn();
  recomputeHappiness();
  log(`<b>Day ${state.day}:</b> ${line}`);
  persist(`Day ${state.day}: ${line}`);
  save(state);
  renderStats();
  checkGameOver();
};

window.nextDay = function () {
  const lines = advanceDay(state);
  for (const l of lines) {
    const inner = l.kind === 'event' ? `<span class="ev">${l.text}</span>` : l.text;
    log(`<b>Day ${state.day}:</b> ${inner}`);
    persist(`Day ${state.day}: ${l.text}`);
  }
  save(state);
  renderStats();
  checkGameOver();
};

function checkGameOver() {
  if (state.energy <= 0) {
    log('<b>GAME OVER:</b> Exhausted. Reset or pick a new path.');
    document.querySelectorAll('#actions .btn').forEach(b => b.disabled = true);
  }
}

window.startGame = function (t) {
  const c = archetypes[t];
  state.type = t;
  state.money = c.money;
  state.room = c.room;
  state.career = c.career;
  state.day = 1;
  state.energy = 60;
  state.hunger = 60;
  state.fun = 50;
  state.hygiene = 60;
  state.social = 50;
  state.happiness = 70;
  state.rentDueDay = 6;
  state.eventLog = [];
  persist(`New game: ${c.name} — ${c.career}`);
  save(state);
  showGame();
  log(`<b>Karibu!</b> You are a ${c.career}. Rent due Saturday. Hustle wisely.`);
};

$('resetBtn').onclick = () => {
  if (!confirm('Reset this run? Your save will be cleared.')) return;
  reset();
  save(state);
  renderStats();
  log('<b>Reset.</b> Fresh start on the same path.');
};
$('newBtn').onclick = () => {
  if (!confirm('Start a new game? Current progress is cleared.')) return;
  reset();
  save(state);
  $('game').classList.remove('active');
  $('select').classList.add('active');
  renderArchetypes();
};

renderArchetypes();
renderNPCs();

if (hasSave() && load()) {
  const row = $('continueRow');
  const b = document.createElement('button');
  b.className = 'btn';
  b.textContent = `Continue — Day ${state.day}, KES ${state.money.toLocaleString()}`;
  b.onclick = () => { showGame(); log('<b>Saved game loaded.</b>'); };
  row.appendChild(b);
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
